services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: jwt-auth-api:latest
    container_name: jwt-auth-api
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-supersecretkey-change-in-production-please}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
